<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <!-- Seu CSS -->
    <link
        rel="stylesheet"
        href="src/css/styles.css"
    >


    <title>Dashboard</title>

</head>


<body>


    <!-- SIDEBAR -->
    <nav id="sidebar">


        <div id="sidebar_content">


            <!-- USUÁRIO -->
            <div id="user">


                <img
                    src="src/images/avatar.jpg"
                    id="user_avatar"
                    alt="Avatar"
                >


                <p id="user_infos">


                    <!-- NOME -->
                    <span
                        class="item-description"
                        id="nomeUsuario"
                    >
                        Usuário
                    </span>


                    <!-- EMAIL -->
                    <span
                        class="item-description"
                        id="emailUsuario"
                    >
                        email@email.com
                    </span>


                </p>


            </div>



            <!-- MENU -->
            <ul id="side_items">


                <!-- DASHBOARD -->
                <li class="side-item active">

                    <a href="#">

                        <i
                            class="fa-solid fa-chart-line"
                        ></i>

                        <span class="item-description">
                            Dashboard
                        </span>

                    </a>

                </li>



                <!-- PERFIL -->
                <li class="side-item">

                    <a href="#">

                        <i
                            class="fa-solid fa-user"
                        ></i>

                        <span class="item-description">
                            Perfil
                        </span>

                    </a>

                </li>



                <!-- CONFIGURAÇÕES -->
                <li class="side-item">

                    <a href="#">

                        <i
                            class="fa-solid fa-gear"
                        ></i>

                        <span class="item-description">
                            Configurações
                        </span>

                    </a>

                </li>


            </ul>



            <!-- BOTÃO ABRIR SIDEBAR -->
            <button id="open_btn">

                <i
                    id="open_btn_icon"
                    class="fa-solid fa-chevron-right"
                ></i>

            </button>


        </div>



        <!-- LOGOUT -->
        <div id="logout">


            <button id="logout_btn">

                <i
                    class="fa-solid fa-right-from-bracket"
                ></i>

                <span class="item-description">
                    Sair
                </span>

            </button>


        </div>


    </nav>



    <!-- CONTEÚDO -->
    <main>

        <h1>Dashboard</h1>

        <p>
            Bem-vindo ao sistema!
        </p>

    </main>



    <!-- JavaScript da Sidebar -->
    <script
        src="src/javascript/script.js"
    ></script>



    <!-- JavaScript do Login -->
    <script>


        // ==========================================
        // VERIFICAR SE ESTÁ LOGADO
        // ==========================================

        const logado =
            sessionStorage.getItem("logado");


        // Se não estiver logado,
        // volta para o login
        if (logado !== "true") {

            window.location.href =
                "login.html";

        }



        // ==========================================
        // PEGAR DADOS DO USUÁRIO
        // ==========================================

        const nome =
            localStorage.getItem("nome");

        const email =
            localStorage.getItem("email");



        // ==========================================
        // MOSTRAR DADOS NA SIDEBAR
        // ==========================================

        document.getElementById(
            "nomeUsuario"
        ).textContent =
            nome || "Usuário";


        document.getElementById(
            "emailUsuario"
        ).textContent =
            email || "Email não encontrado";



        // ==========================================
        // LOGOUT
        // ==========================================

        document
            .getElementById("logout_btn")
            .addEventListener(
                "click",
                function() {


                    // Remove a sessão
                    sessionStorage.removeItem(
                        "logado"
                    );


                    // Volta para o Login
                    window.location.href =
                        "login.html";


                }
            );


    </script>


</body>

</html>
